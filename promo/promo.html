<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Brave Marketing — promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* ============ TOKENS — те же, что на сайте ============ */
:root{
  --ground:#F0EFEA;
  --ink:#171614;
  --ink-2:#5E5C55;
  --ink-3:#8A877E;
  --char:#23221E;
  --line:#DEDBD2;
  --verm:#F0522B;
  --sand:#D9A441;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#8A877E}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

/* Формат Instagram 4:5 */
.card{
  position:relative;
  width:1080px;height:1350px;
  background:var(--ground);
  overflow:hidden;
  font-family:Archivo,system-ui,sans-serif;
  color:var(--ink);
}

/* ============ ФОНОВАЯ ГРАФИКА ============ */
/* Торические узлы — тот же рендерер, что в первом экране сайта */
.knots{position:absolute;inset:0;z-index:0;pointer-events:none}
.knots canvas{position:absolute;display:block}
#kTop{width:680px;height:680px;top:-206px;right:-196px}
#kBot{width:440px;height:440px;bottom:-206px;left:-196px}

/* Мягкая виньетка: центр светлее, углы чуть глубже — узлы не спорят с текстом */
.vignette{
  position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(115% 78% at 34% 46%,
    rgba(240,239,234,.94) 0%,
    rgba(240,239,234,.72) 38%,
    rgba(240,239,234,0) 72%);
}
/* Зерно — убирает пластиковую плоскость заливки */
.grain{
  position:absolute;inset:0;z-index:2;pointer-events:none;
  opacity:.05;mix-blend-mode:multiply;
}

/* ============ СЕТКА КАРТОЧКИ ============ */
.inner{
  position:relative;z-index:3;
  height:100%;
  padding:86px 88px 78px;
  display:flex;flex-direction:column;
}

/* -- верхняя строка: счётчик услуги -- */
.top{display:flex;justify-content:flex-start}
.count{
  font-size:19px;font-weight:600;letter-spacing:.16em;
  color:var(--ink-3);
}
.count b{color:var(--ink);font-weight:700}

/* -- центральный блок: по вертикали посередине -- */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:26px}

.eyebrow{display:flex;align-items:center;gap:22px;margin-bottom:26px}
.eyebrow .rule{width:64px;height:4px;background:var(--verm);border-radius:2px}
.eyebrow span{
  font-size:22px;font-weight:600;letter-spacing:.22em;
  color:var(--ink-3);text-transform:uppercase;
}

h1{
  font-family:Anton,Archivo,sans-serif;
  font-weight:400;
  font-size:106px;
  line-height:1.0;
  letter-spacing:.005em;
  text-transform:uppercase;
}
h1 .v{color:var(--verm)}
h1 span{display:block}

/* Подводка под заголовком */
.desc{
  margin-top:32px;
  max-width:31ch;
  font-size:27px;line-height:1.42;
  color:var(--ink-2);
}

/* Тонкая линия-разделитель */
.hr{height:1px;background:var(--line);margin:34px 0 28px;max-width:660px}

/* Чипы платформ */
.chips{display:flex;flex-wrap:wrap;gap:11px;max-width:700px}
.chip{
  padding:11px 20px;border:1.5px solid var(--line);border-radius:999px;
  font-size:20px;font-weight:500;color:var(--ink-2);background:rgba(255,255,255,.5);
}

/* Цена */
.price{display:flex;align-items:baseline;gap:14px;margin-top:34px}
.price b{
  font-family:Anton,Archivo,sans-serif;font-weight:400;
  font-size:58px;line-height:1;letter-spacing:.01em;
}
.price .unit{font-size:24px;font-weight:500;color:var(--ink-2)}
.price .vat{font-size:19px;color:var(--ink-3);margin-left:4px}

/* ============ ПОДВАЛ ============ */
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{
  display:flex;align-items:center;gap:16px;
  background:var(--char);border-radius:999px;
  padding:17px 30px 17px 22px;
}
.logo .mark{width:38px;height:38px;flex:none}
.logo .txt{display:flex;flex-direction:column;line-height:1}
.logo .b{
  font-family:Anton,Archivo,sans-serif;font-weight:400;
  font-size:30px;color:#F6F5F1;letter-spacing:.02em;
}
.logo .m{
  font-size:14px;font-weight:700;letter-spacing:.34em;
  color:var(--sand);margin-top:6px;
}
.site{
  font-size:22px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;
}
</style>
</head>
<body>

<div class="card">

  <div class="knots" aria-hidden="true">
    <canvas id="kTop"></canvas>
    <canvas id="kBot"></canvas>
  </div>
  <div class="vignette"></div>
  <svg class="grain" aria-hidden="true">
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/></filter>
    <rect width="100%" height="100%" filter="url(#n)"/>
  </svg>

  <div class="inner">

    <div class="top">
      <div class="count"><b id="idx">01</b> / <span id="total">06</span></div>
    </div>

    <div class="mid">
      <div class="eyebrow">
        <i class="rule"></i>
        <span id="tag">Servicios · Para empresas</span>
      </div>

      <h1 id="title"></h1>

      <p class="desc" id="desc"></p>

      <div class="hr"></div>

      <div class="chips" id="chips"></div>

      <div class="price">
        <b id="price"></b>
        <span class="unit" id="unit"></span>
        <span class="vat" id="vat">IVA no incluido</span>
      </div>
    </div>

    <div class="foot">
      <div class="logo">
        <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
          <g fill="none" stroke-width="2.1">
            <ellipse cx="13" cy="13" rx="5" ry="9.4" transform="rotate(-32 13 13)" stroke="#F6F5F1"/>
            <ellipse cx="13" cy="13" rx="5" ry="9.4" transform="rotate(32 13 13)" stroke="#F0522B"/>
          </g>
        </svg>
        <div class="txt">
          <div class="b">BRAVE</div>
          <div class="m">MARKETING</div>
        </div>
      </div>
      <div class="site">bravemarketing.online</div>
    </div>

  </div>
</div>

<script>
/* ==================================================================
   1. Данные услуг. Заголовок разбит на строки вручную —
      так контролируется, где ломается фраза и что уходит в красный.
   ================================================================== */
var SERVICES=[
  {
    tag:"Servicios · Para empresas",
    title:[{t:"SMM y"},{t:"gestión de"},{t:"redes",v:1},{t:"sociales",v:1}],
    desc:"Estrategia, contenido y gestión diaria de tus redes: del plan de publicaciones a la interacción con la audiencia.",
    chips:["Instagram","X (Twitter)","TikTok","Facebook"],
    price:"€990", unit:"al mes", vat:"IVA no incluido"
  }
];

/* ==================================================================
   2. Отрисовка выбранной услуги (?i=0)
   ================================================================== */
var i=parseInt(new URLSearchParams(location.search).get("i")||"0",10);
var s=SERVICES[i]||SERVICES[0];

document.getElementById("idx").textContent=String(i+1).padStart(2,"0");
document.getElementById("total").textContent=String(SERVICES.length).padStart(2,"0");
document.getElementById("tag").textContent=s.tag;
document.getElementById("desc").textContent=s.desc;
document.getElementById("price").textContent=s.price;
document.getElementById("unit").textContent=s.unit;
document.getElementById("vat").textContent=s.vat||"";

document.getElementById("title").innerHTML=s.title.map(function(l){
  return '<span class="'+(l.v?"v":"")+'">'+l.t+'</span>';
}).join("");

document.getElementById("chips").innerHTML=s.chips.map(function(c){
  return '<span class="chip">'+c+'</span>';
}).join("");

/* ==================================================================
   3. Torus knot renderer — тот же код, что на сайте
   ================================================================== */
function hexRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixRgb(a,b,t){return "rgb("+Math.round(a[0]+(b[0]-a[0])*t)+","+Math.round(a[1]+(b[1]-a[1])*t)+","+Math.round(a[2]+(b[2]-a[2])*t)+")";}

function drawKnot(cv,o,rot){
  var ctx=cv.getContext("2d"),dark=hexRgb(o.dark),light=hexRgb(o.light);
  var dpr=2,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var S=Math.min(W,H)/300;
  var N=o.samples||460,R=o.R*S,r=o.r*S,f=1400*S,cx=W/2,cy=H/2;
  var ca=Math.cos(rot),sa=Math.sin(rot);
  var tb=rot*0.55+o.tilt,cb=Math.cos(tb),sb=Math.sin(tb);
  var pts=new Array(N+1),zmin=1e9,zmax=-1e9,i;
  for(i=0;i<=N;i++){
    var t=i/N*Math.PI*2,a=o.p*t,b=o.q*t;
    var x=(R+r*Math.cos(b))*Math.cos(a);
    var y=(R+r*Math.cos(b))*Math.sin(a);
    var z=r*Math.sin(b)*1.7;
    var x1=x*ca+z*sa, z1=-x*sa+z*ca;
    var y1=y*cb-z1*sb, z2=y*sb+z1*cb;
    var sc=f/(f-z2);
    pts[i]={x:cx+x1*sc,y:cy+y1*sc,z:z2,s:sc};
    if(z2<zmin)zmin=z2; if(z2>zmax)zmax=z2;
  }
  var span=(zmax-zmin)||1,order=[];
  for(i=0;i<N;i++)order.push(i);
  order.sort(function(A,B){return (pts[A].z+pts[A+1].z)-(pts[B].z+pts[B+1].z);});
  ctx.lineCap="round";
  for(i=0;i<order.length;i++){
    var j=order[i],a1=pts[j],a2=pts[j+1];
    var zt=((a1.z+a2.z)/2-zmin)/span;
    ctx.strokeStyle=mixRgb(dark,light,Math.pow(zt,0.8));
    ctx.lineWidth=o.thick*S*((a1.s+a2.s)/2);
    ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
  }
}

var GOLD={dark:"#8A6524",light:"#F4E1B4"};
function paint(){
  drawKnot(document.getElementById("kTop"),{p:2,q:3,R:74,r:32,thick:26,tilt:0.6,dark:GOLD.dark,light:GOLD.light},0.9);
  drawKnot(document.getElementById("kBot"),{p:3,q:4,R:72,r:30,thick:23,tilt:2.1,dark:GOLD.dark,light:GOLD.light},2.4);
}
paint();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(paint);}
</script>
</body>
</html>
