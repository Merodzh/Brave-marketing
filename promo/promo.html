<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Brave Marketing — promo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* ============ TOKENS — те же, что на сайте ============ */
:root{
  --ground:#F0EFEA;
  --ink:#171614;
  --ink-3:#8A877E;
  --char:#23221E;
  --verm:#F0522B;
  --sand:#D9A441;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#8A877E}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

/* Формат Instagram 4:5 */
.card{
  position:relative;
  width:1080px;height:1350px;
  background:var(--ground);
  overflow:hidden;
  font-family:Archivo,system-ui,sans-serif;
  color:var(--ink);
}

/* ============ ФОНОВАЯ ГРАФИКА ============ */
/* Торические узлы — тот же рендерер, что в первом экране сайта */
.knots{position:absolute;inset:0;z-index:0;pointer-events:none}
.knots canvas{position:absolute;display:block}
#kTop{width:660px;height:660px;top:-196px;right:-186px}
#kBot{width:450px;height:450px;bottom:-186px;left:-176px}

/* ============ СЕТКА КАРТОЧКИ ============ */
.inner{
  position:relative;z-index:2;
  height:100%;
  padding:86px 88px 78px;
  display:flex;flex-direction:column;
}

/* Заголовочный блок — по вертикали посередине */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:64px}

.eyebrow{display:flex;align-items:center;gap:22px;margin-bottom:24px}
.eyebrow .rule{width:64px;height:4px;background:var(--verm);border-radius:2px}
.eyebrow span{
  font-size:21px;font-weight:600;letter-spacing:.22em;
  color:var(--ink-3);text-transform:uppercase;
}

h1{
  font-family:Anton,Archivo,sans-serif;
  font-weight:400;
  font-size:150px;
  line-height:1.02;
  letter-spacing:.005em;
  text-transform:uppercase;
}
h1 .v{color:var(--verm)}
h1 span{display:block;white-space:nowrap}
/* Строка с акцентом или тильдой (Ó, Í, Ñ) получает чуть больше воздуха
   сверху: иначе диакритика упирается в строку выше. */
h1 span.gap{margin-top:.09em}

/* ============ ПОДВАЛ ============ */
.foot{display:flex;align-items:center;justify-content:space-between;gap:24px}
.logo{
  display:flex;align-items:center;gap:16px;
  background:var(--char);border-radius:999px;
  padding:17px 30px 17px 22px;
}
.logo .mark{width:38px;height:38px;flex:none}
.logo .txt{display:flex;flex-direction:column;line-height:1}
.logo .b{
  font-family:Anton,Archivo,sans-serif;font-weight:400;
  font-size:30px;color:#F6F5F1;letter-spacing:.02em;
}
.logo .m{
  font-size:14px;font-weight:700;letter-spacing:.34em;
  color:var(--sand);margin-top:6px;
}
.site{
  font-size:21px;font-weight:600;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;
}
</style>
</head>
<body>

<div class="card">

  <div class="knots" aria-hidden="true">
    <canvas id="kTop"></canvas>
    <canvas id="kBot"></canvas>
  </div>

  <div class="inner">
    <div class="mid">
      <div class="eyebrow">
        <i class="rule"></i>
        <span id="tag">Servicios · Para empresas</span>
      </div>
      <h1 id="title"></h1>
    </div>

    <div class="foot">
      <div class="logo">
        <svg class="mark" viewBox="0 0 26 26" aria-hidden="true">
          <g fill="none" stroke-width="2.1">
            <ellipse cx="13" cy="13" rx="5" ry="9.4" transform="rotate(-32 13 13)" stroke="#F6F5F1"/>
            <ellipse cx="13" cy="13" rx="5" ry="9.4" transform="rotate(32 13 13)" stroke="#F0522B"/>
          </g>
        </svg>
        <div class="txt">
          <div class="b">BRAVE</div>
          <div class="m">MARKETING</div>
        </div>
      </div>
      <div class="site">bravemarketing.online</div>
    </div>
  </div>
</div>

<script>
/* ==================================================================
   1. Услуги. Заголовок разбит на строки вручную —
      так контролируется, где ломается фраза и что уходит в красный.
   ================================================================== */
var SERVICES=[
  /* --- PARA EMPRESAS --- */
  {tag:"Servicios · Para empresas",
   title:[{t:"SMM y"},{t:"gestión de"},{t:"redes",v:1},{t:"sociales",v:1}]},

  {tag:"Servicios · Para empresas",
   title:[{t:"Configuración"},{t:"de campañas"},{t:"publicitarias",v:1}]},

  {tag:"Servicios · Para empresas",
   title:[{t:"Consultoría"},{t:"de marketing"},{t:"digital y",v:1},{t:"ventas online",v:1}]},

  /* --- PARA PARTICULARES --- */
  {tag:"Servicios · Para particulares",
   title:[{t:"Gestión y"},{t:"promoción de"},{t:"redes",v:1},{t:"sociales",v:1}]},

  {tag:"Servicios · Para particulares",
   title:[{t:"Creación de"},{t:"marca"},{t:"personal en",v:1},{t:"Instagram",v:1}]},

  {tag:"Servicios · Para particulares",
   title:[{t:"Consultoría"},{t:"de blog y"},{t:"marca",v:1},{t:"personal",v:1}]}
];

/* ==================================================================
   2. Отрисовка выбранной услуги (?i=0)
   ================================================================== */
var i=parseInt(new URLSearchParams(location.search).get("i")||"0",10);
var s=SERVICES[i]||SERVICES[0];

document.getElementById("tag").textContent=s.tag;
var h1=document.getElementById("title");
h1.innerHTML=s.title.map(function(l,n){
  var cls=l.v?"v":"";
  if(n>0&&/[ÁÉÍÓÚÜÑ]/.test(l.t.toUpperCase()))cls+=" gap";
  return '<span class="'+cls.trim()+'">'+l.t+'</span>';
}).join("");

/* Кегль подбирается по самой длинной строке: заголовок не вылезает
   за поля, но остаётся максимально крупным. */
function fitTitle(){
  var max=1080-88*2, size=150;
  h1.style.fontSize=size+"px";
  while(size>104){
    var over=false;
    Array.prototype.forEach.call(h1.children,function(el){
      if(el.getBoundingClientRect().width>max)over=true;
    });
    if(!over)break;
    size-=2;
    h1.style.fontSize=size+"px";
  }
}
fitTitle();

/* ==================================================================
   3. Torus knot renderer — тот же код, что на сайте
   ================================================================== */
function hexRgb(h){h=h.replace("#","");return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function mixRgb(a,b,t){return "rgb("+Math.round(a[0]+(b[0]-a[0])*t)+","+Math.round(a[1]+(b[1]-a[1])*t)+","+Math.round(a[2]+(b[2]-a[2])*t)+")";}

function drawKnot(cv,o,rot){
  var ctx=cv.getContext("2d"),dark=hexRgb(o.dark),light=hexRgb(o.light);
  var dpr=2,W=cv.clientWidth,H=cv.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  var S=Math.min(W,H)/300;
  var N=o.samples||460,R=o.R*S,r=o.r*S,f=1400*S,cx=W/2,cy=H/2;
  var ca=Math.cos(rot),sa=Math.sin(rot);
  var tb=rot*0.55+o.tilt,cb=Math.cos(tb),sb=Math.sin(tb);
  var pts=new Array(N+1),zmin=1e9,zmax=-1e9,k;
  for(k=0;k<=N;k++){
    var t=k/N*Math.PI*2,a=o.p*t,b=o.q*t;
    var x=(R+r*Math.cos(b))*Math.cos(a);
    var y=(R+r*Math.cos(b))*Math.sin(a);
    var z=r*Math.sin(b)*1.7;
    var x1=x*ca+z*sa, z1=-x*sa+z*ca;
    var y1=y*cb-z1*sb, z2=y*sb+z1*cb;
    var sc=f/(f-z2);
    pts[k]={x:cx+x1*sc,y:cy+y1*sc,z:z2,s:sc};
    if(z2<zmin)zmin=z2; if(z2>zmax)zmax=z2;
  }
  var span=(zmax-zmin)||1,order=[];
  for(k=0;k<N;k++)order.push(k);
  order.sort(function(A,B){return (pts[A].z+pts[A+1].z)-(pts[B].z+pts[B+1].z);});
  ctx.lineCap="round";
  for(k=0;k<order.length;k++){
    var j=order[k],a1=pts[j],a2=pts[j+1];
    var zt=((a1.z+a2.z)/2-zmin)/span;
    ctx.strokeStyle=mixRgb(dark,light,Math.pow(zt,0.8));
    ctx.lineWidth=o.thick*S*((a1.s+a2.s)/2);
    ctx.beginPath();ctx.moveTo(a1.x,a1.y);ctx.lineTo(a2.x,a2.y);ctx.stroke();
  }
}

var GOLD={dark:"#8A6524",light:"#F4E1B4"};
function paint(){
  drawKnot(document.getElementById("kTop"),{p:2,q:3,R:74,r:32,thick:26,tilt:0.6+i*0.34,dark:GOLD.dark,light:GOLD.light},0.9+i*0.62);
  drawKnot(document.getElementById("kBot"),{p:3,q:4,R:72,r:30,thick:23,tilt:2.1+i*0.29,dark:GOLD.dark,light:GOLD.light},2.4+i*0.47);
}
paint();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){fitTitle();paint();});}
</script>
</body>
</html>
